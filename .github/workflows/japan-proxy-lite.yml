name: Build Japan Proxy Lite

on:
  workflow_dispatch: {}
  push:
    branches:
      - japan-proxy-lite

concurrency:
  group: japan-proxy-lite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Public identity is pinned in source so an accidental signing-key change fails CI.
      JAPAN_PROXY_CERT_SHA256: 186fdf3f4f6342b682ad8b8f71f64db98096e49e4578d1e0bb5e4ba04c141a8b

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;29.0.14206865'

      - name: Build native tunnel library
        env:
          ABIS: arm64-v8a
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: bash compile-hevtun.sh

      - name: Copy native tunnel library
        run: cp -r libs V2rayNG/app/

      - name: Resolve Xray library version
        id: xray
        shell: bash
        run: |
          cd AndroidLibXrayLite
          echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Download Xray Android library
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ steps.xray.outputs.tag }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Restore release keystore
        shell: bash
        env:
          JAPAN_PROXY_KEYSTORE_BASE64: ${{ secrets.JAPAN_PROXY_KEYSTORE_BASE64 }}
          JAPAN_PROXY_KEYSTORE_PASSWORD: ${{ secrets.JAPAN_PROXY_KEYSTORE_PASSWORD }}
          JAPAN_PROXY_KEY_ALIAS: ${{ secrets.JAPAN_PROXY_KEY_ALIAS }}
          JAPAN_PROXY_KEY_PASSWORD: ${{ secrets.JAPAN_PROXY_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          for variable in \
            JAPAN_PROXY_KEYSTORE_BASE64 \
            JAPAN_PROXY_KEYSTORE_PASSWORD \
            JAPAN_PROXY_KEY_ALIAS \
            JAPAN_PROXY_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              missing+=("$variable")
            fi
          done

          if [[ ${#missing[@]} -ne 0 ]]; then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          printf '%s' "$JAPAN_PROXY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/japan-proxy-release.p12"
          chmod 600 "$RUNNER_TEMP/japan-proxy-release.p12"

      - name: Build signed ARM64 release APK
        working-directory: V2rayNG
        env:
          JAPAN_PROXY_KEYSTORE_PATH: ${{ runner.temp }}/japan-proxy-release.p12
          JAPAN_PROXY_KEYSTORE_PASSWORD: ${{ secrets.JAPAN_PROXY_KEYSTORE_PASSWORD }}
          JAPAN_PROXY_KEY_ALIAS: ${{ secrets.JAPAN_PROXY_KEY_ALIAS }}
          JAPAN_PROXY_KEY_PASSWORD: ${{ secrets.JAPAN_PROXY_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew :app:assemblePlaystoreRelease --no-daemon --stacktrace

      - name: Verify package, signature and ABI
        id: verify-apk
        working-directory: V2rayNG
        shell: bash
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/playstore/release -maxdepth 1 -type f -name '*arm64-v8a*.apk')
          if [[ ${#apks[@]} -ne 1 ]]; then
            printf 'Expected one ARM64 APK, found %s\n' "${#apks[@]}" >&2
            exit 1
          fi

          apk="${apks[0]}"
          test "$(apkanalyzer manifest application-id "$apk")" = "com.kalelu.japanproxy"
          signature_report="$("${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$signature_report"
          cert_digest="$(
            printf '%s\n' "$signature_report" |
              awk -F ': ' '/certificate SHA-256 digest:/ { print $NF; exit }'
          )"
          if [[ "${cert_digest,,}" != "${JAPAN_PROXY_CERT_SHA256,,}" ]]; then
            printf 'Unexpected signing certificate: %s\n' "${cert_digest:-missing}" >&2
            exit 1
          fi

          mapfile -t packaged_abis < <(
            unzip -Z1 "$apk" |
              sed -n 's#^lib/\([^/]*\)/.*#\1#p' |
              sort -u
          )
          if [[ "${packaged_abis[*]}" != "arm64-v8a" ]]; then
            printf 'Unexpected packaged ABIs: %s\n' "${packaged_abis[*]:-none}" >&2
            exit 1
          fi

          echo "apk_path=$(realpath "$apk")" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: JapanProxy-Lite-arm64-v8a-release
          path: ${{ steps.verify-apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/japan-proxy-release.p12"
